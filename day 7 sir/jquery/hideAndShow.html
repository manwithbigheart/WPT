<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      .cls1 {
        border: 3px solid red;
        width: 300px;
        height: 200px;
        margin: auto;
        border-radius: 6px;
        transition: transform 2s;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <button type="button" id="btnHide">Hide</button> &nbsp;&nbsp;&nbsp;
    <button type="button" id="btnShow">Show</button> <br />

    <video controls width="300px" height="300px" id="vdo">
      <source src="../assets/multimedia/sample-vdo.mp4" />
    </video>
    <hr />
    <h2 id="d3">Hello Friends, I am Panchashil Wankhede</h2>
    <hr>
    <img class="cls1" src="../assets/images/happy-imoji.jfif" alt="">
    <script>
      $(document).ready(function () {
        $("#btnHide").click(() => {
          $("#vdo").hide(3000, () => window.alert("video hide successfully"));
        });
        $("#btnShow").click(() => {
          $("#vdo").show(3000, () => window.alert("video show successfully"));
        });
        //    apply css property
        $("#d3").mouseenter(function () {
          $(this).css({ color: "blue", "background-color": "aqua" });
        });
        $("#d3").mouseleave(function () {
          $(this).css({ color: "red", "background-color": "aqua" });
        });
        $("#d3").click(function () {
          $(this).css({ "text-align": "center", "background-color": "aqua" });
        });
       
        $('.cls1').mouseenter(function (){
            $(this).css({'transform':' rotateY(340deg)'})
        })

      });
    </script>
  </body>
</html>
