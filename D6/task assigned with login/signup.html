<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow">
      <h3 class="text-center mb-3">Signup</h3>
      <form onsubmit="signup(event)">
        <div class="row mb-3">
          <div class="col">
            <input type="text" id="fname" class="form-control" placeholder="First Name" required>
          </div>
          <div class="col">
            <input type="text" id="lname" class="form-control" placeholder="Last Name" required>
          </div>
        </div>
        <div class="mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
        <div class="mb-3">
          <input type="password" id="cpassword" class="form-control" placeholder="Confirm Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Signup</button>
        <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </div>
</div>

<script>
function signup(e){
  e.preventDefault();
  
  let fname = document.getElementById("fname").value;
  let lname = document.getElementById("lname").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let cpassword = document.getElementById("cpassword").value;

  if(password !== cpassword){
    alert("Passwords do not match!");
    return;
  }

  let user = { id: Date.now(), fname, lname, email, password };

  let xhr = new XMLHttpRequest();
  xhr.open("POST", "http://localhost:8888/users");
  xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
  xhr.onload = function(){
    if(xhr.status === 201){
      alert("Signup successful! Please login.");
      window.location.href = "login.html";
    }
  }
  xhr.send(JSON.stringify(user));
}
</script>

</body>
</html>
