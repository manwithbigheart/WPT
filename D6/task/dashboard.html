<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .dashboard-container {
            text-align: center;
            padding: 3rem;
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="dashboard-container" id="dashboard">
        <!-- Content will be added here by JavaScript -->
    </div>

    <script>
        // This script runs as soon as the page loads
        document.addEventListener('DOMContentLoaded', function() {
            const dashboardDiv = document.getElementById('dashboard');

            // Check if we saved user data in localStorage from the login page
            const loggedInUserString = localStorage.getItem('loggedInUser');

            if (loggedInUserString) {
                // If user data exists, parse it from a string back to an object
                const user = JSON.parse(loggedInUserString);

                // Display a welcome message and a logout button
                dashboardDiv.innerHTML = `
                    <h1>Welcome, ${user.username}!</h1>
                    <p>You have successfully logged in.</p>
                    <button id="logoutButton" class="btn btn-danger mt-3">Logout</button>
                `;

                // Add functionality to the logout button
                const logoutButton = document.getElementById('logoutButton');
                logoutButton.addEventListener('click', function() {
                    // Remove the user data from localStorage
                    localStorage.removeItem('loggedInUser');
                    // Redirect back to the login page
                    window.location.href = 'login.html';
                });

            } else {
                // If no user data is found, show a message and a button to login
                dashboardDiv.innerHTML = `
                    <h1>Access Denied</h1>
                    <p>You must be logged in to view this page.</p>
                    <a href="login.html" class="btn btn-primary mt-3">Go to Login</a>
                `;
            }
        });
    </script>

</body>
</html>
